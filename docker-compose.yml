services:
  postgres:
    image: postgres:17-alpine
    container_name: eventprogram-postgres
    environment:
      POSTGRES_DB: eventprogram
      POSTGRES_USER: eventprogram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventprogram -d eventprogram"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
